services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solarpanel_db
      POSTGRES_USER: solarpanel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarpanel_dev}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarpanel -d solarpanel_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: solarpanel_db
      PGUSER: solarpanel
      PGPASSWORD: ${POSTGRES_PASSWORD:-solarpanel_dev}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ONLINE_THRESHOLD_SECONDS: ${ONLINE_THRESHOLD_SECONDS:-180}
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:
